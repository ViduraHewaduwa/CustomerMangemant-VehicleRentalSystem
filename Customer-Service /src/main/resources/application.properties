spring.application.name=customer-service

# Default local profile uses in-memory H2.
spring.datasource.url=jdbc:h2:mem:customers;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console for local debug.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret must be at least 32 bytes.
security.jwt.secret=${JWT_SECRET:ChangeThisToAStrongSecretKeyAtLeast32Chars!}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
