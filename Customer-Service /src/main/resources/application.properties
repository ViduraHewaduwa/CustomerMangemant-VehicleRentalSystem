spring.application.name=customer-service

# Persistent MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/customer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 console disabled because MySQL is the active database
spring.h2.console.enabled=false

# JWT secret must be at least 32 bytes.
security.jwt.secret=${JWT_SECRET:ChangeThisToAStrongSecretKeyAtLeast32Chars!}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
