name: CI
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: "Customer-Service"
    env:
      IMAGE_NAME: customer-service
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Build and test
        run: mvn -B verify

      - name: SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=vidurahewaduwa -Dsonar.projectKey=ViduraHewaduwa_CustomerMangemant-VehicleRentalSystem

      - name: Build Docker image (CI)
        run: docker build -t customer-service:ci .

      - name: Login to ACR (admin user)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "$ACR_LOGIN_SERVER" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push image to ACR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          IMAGE_SHA=$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          IMAGE_LATEST=$ACR_LOGIN_SERVER/$IMAGE_NAME:latest
          docker build --platform linux/amd64 -t $IMAGE_SHA -t $IMAGE_LATEST .
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST
