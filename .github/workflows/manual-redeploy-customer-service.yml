name: Manual Redeploy Customer Service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: false
        default: latest
        type: string
      build_image:
        description: Build and push the image before redeploying
        required: false
        default: false
        type: boolean

jobs:
  redeploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Customer-Service
    env:
      IMAGE_NAME: customer-service
      IMAGE_TAG: ${{ inputs.image_tag }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      LOG_ANALYTICS_NAME: ${{ secrets.LOG_ANALYTICS_NAME }}
      CONTAINERAPPS_ENV_NAME: ${{ secrets.CONTAINERAPPS_ENV_NAME }}
      CONTAINERAPP_NAME: ${{ secrets.CONTAINERAPP_NAME }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: ${{ inputs.build_image }}
        run: echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin

      - name: Build and push image
        if: ${{ inputs.build_image }}
        run: |
          IMAGE_URI="$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"
          docker build --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Redeploy Container App
        run: bash scripts/deploy-azure.sh
