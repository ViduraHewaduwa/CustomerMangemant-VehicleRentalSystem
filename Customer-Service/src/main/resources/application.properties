spring.application.name=customer-service

# Persistent MySQL configuration (override via environment in cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/customer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:customer_service_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0715980980}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 console disabled because MySQL is the active database
spring.h2.console.enabled=false

# JWT secret must be at least 32 bytes.
security.jwt.secret=${JWT_SECRET:ChangeThisToAStrongSecretKeyAtLeast32Chars!}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=customer-group
spring.kafka.consumer.auto-offset-reset=earliest

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_ENABLED:false}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:customer-service-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

app.kafka.payment-topic=${KAFKA_PAYMENT_TOPIC:payment.completed}

